spring.application.name=ms-customers-bs

server.port=8081

# JWT Configuration (must match the BFF secret)
# Use environment variable JWT_SECRET in production
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-make-it-longer-and-more-secure}
jwt.expiration=900000
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration